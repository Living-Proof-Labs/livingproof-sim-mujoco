version: '3'
tasks:
  default:
    desc: Show available commands
    cmds: [task --list]
  setup:
    desc: Build the development image and install locked dependencies
    cmds: [bash tools/run-task.sh setup]
  check:
    desc: Check code and generated help in the development environment
    cmds: [bash tools/run-task.sh check]
  test:
    desc: Test real MuJoCo execution in the development environment
    cmds: [bash tools/run-task.sh test]
  docs:
    desc: Build the browsable manual
    cmds: [bash tools/run-task.sh docs]
  verify:
    desc: Check and test in the development environment
    cmds: [bash tools/run-task.sh verify]
  package:
    desc: Build Python and Debian products
    cmds: [bash tools/run-task.sh package]
  smoke:
    preconditions:
      - sh: command -v docker
        msg: 'This host product task requires Docker. Run it on a Docker host; inside the container use task verify or task package.'
    desc: Test installed wheel, Debian package and runtime image
    platforms: [linux]
    cmds: [bash tools/smoke.sh]
  image:
    preconditions:
      - sh: command -v docker
        msg: 'This host product task requires Docker. Run it on a Docker host; inside the container use task verify or task package.'
    desc: Build the versioned runtime image from the tested wheelhouse
    cmds: ['docker build --target runtime --build-arg VERSION={{.VERSION | default "0.0.0"}} -t livingproof-sim-mujoco:{{.VERSION | default "0.0.0"}} .']
  docs:reference:
    desc: Refresh generated command and Task references
    cmds: [bash tools/run-task.sh docs:reference]
  test:docs:
    desc: Test the rendered manual in Chromium
    cmds: [bash tools/run-task.sh test:docs]
  preview:
    desc: Render falling-sphere playback and serve it on private forwarded port 8000 (container only)
    preconditions:
      - sh: test "${LIVINGPROOF_TOOLING:-}" = 1
        msg: 'Open the development container, then run task preview. For prepared environments use task -t Taskfile.runtime.yml preview.'
    cmds: [task -t Taskfile.runtime.yml preview]
  test:preview:
    desc: Test rendered playback and browser controls
    cmds: [bash tools/run-task.sh test:preview]
  render:
    desc: Render falling-sphere evidence without a server
    cmds: [bash tools/run-task.sh render]
