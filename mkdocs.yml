# SPDX-License-Identifier: Apache-2.0
site_name: Living Proof Labs — MuJoCo
site_url: https://docs.livingprooflabs.com/livingproof-sim-mujoco/
use_directory_urls: false
strict: true
docs_dir: artifacts/manual/source
site_dir: artifacts/manual/html
repo_url: https://github.com/Living-Proof-Labs/livingproof-sim-mujoco
nav:
  - Documentation home: https://docs.livingprooflabs.com/
  - Start here: index.md
  - Guides: release.md
  - Reference:
      - Commands: command.md
      - Tasks: tasks.md
  - Scenarios and results: features.md
  - Verification: verification.md
  - Contribute: contribute.md
  - Version and source: context.md
  - Historical evidence: evidence.md
theme:
  name: zensical
  font: false
  palette:
    - media: '(prefers-color-scheme)'
      toggle: {icon: lucide/sun-moon, name: Switch to light mode}
    - media: '(prefers-color-scheme: light)'
      scheme: default
      toggle: {icon: lucide/sun, name: Switch to dark mode}
    - media: '(prefers-color-scheme: dark)'
      scheme: slate
      toggle: {icon: lucide/moon, name: Switch to system preference}
markdown_extensions:
  - tables
  - toc:
      permalink: true
  - pymdownx.superfences
