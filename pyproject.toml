[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0", "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl"]
build-backend = "hatchling.build"

[project]
name = "livingproof-sim-mujoco"
dynamic = ["version"]
description = "Bounded native MuJoCo model loading and headless physics stepping"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mujoco==3.17.0", "onnxruntime==1.31.1", "numpy>=1.26", "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl"]

[project.optional-dependencies]
# TorchScript policies (for example unitree_rl_gym motion.pt), CPU wheels
torch = ["torch>=2.6"]
# MCAP recordings and mp4 screencasts of walk-hallway trials (livingproof_sim_mujoco.media)
media = ["mcap>=1.2", "imageio>=2.34", "imageio-ffmpeg>=0.5"]

[project.scripts]
livingproof-sim-mujoco = "livingproof_sim_mujoco.cli:main"

[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
[dependency-groups]
dev = [
    "jsonschema==4.25.1",
    "pytest==8.4.2",
    "onnx==1.23.2",
    "pillow==11.3.0",
    "mcap==1.6.0",
    "imageio==2.37.0",
    "imageio-ffmpeg==0.6.0",
    "ruff==0.14.2",
    "build==1.3.0",
    "pip==25.3",
    "zensical==0.0.73",
    "playwright==1.64.1",
]
# TorchScript backend tests only. Kept out of `dev` so the packaging test wheelhouse
# (uv export --only-group dev, then pip download from PyPI) never needs the +cpu wheel,
# which exists only on the PyTorch index. The runner wheel itself has no torch dependency;
# TorchScript users install the `torch` extra.
torch = ["torch==2.15.0"]
[tool.uv]
default-groups = ["dev", "torch"]

[tool.pytest.ini_options]
addopts = "-ra"
[tool.ruff]
line-length = 100

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
