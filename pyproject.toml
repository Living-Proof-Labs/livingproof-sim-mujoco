[build-system]
requires = ["hatchling==1.27.0", "hatch-vcs==0.5.0", "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl"]
build-backend = "hatchling.build"

[project]
name = "livingproof-sim-mujoco"
dynamic = ["version"]
description = "Bounded native MuJoCo model loading and headless physics stepping"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["mujoco==3.17.0", "livingproof-common @ https://github.com/Living-Proof-Labs/livingproof-common/releases/download/v1.0.0/livingproof_common-1.0.0-py3-none-any.whl"]

[project.scripts]
livingproof-sim-mujoco = "livingproof_sim_mujoco.cli:main"

[tool.hatch.metadata]
allow-direct-references = true
[tool.hatch.version]
source = "vcs"
[tool.hatch.version.raw-options]
fallback_version = "0.0.0"
local_scheme = "no-local-version"
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.2",
    "build==1.3.0",
    "pip==25.3",
    "zensical==0.0.73",
    "playwright==1.64.1",
]
[tool.pytest.ini_options]
addopts = "-ra"
[tool.ruff]
line-length = 100
