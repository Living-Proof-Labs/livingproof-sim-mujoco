name: MuJoCo verification
on:
  pull_request:
  push:
    branches: [main, ci/reporting-failure]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REPORTING_FAILURE_FIXTURE: ${{ github.ref == 'refs/heads/ci/reporting-failure' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - name: Verify Dev Containers lifecycle and installed CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/devcontainer-cli" @devcontainers/cli@0.89.0
          export PATH="$RUNNER_TEMP/devcontainer-cli/node_modules/.bin:$PATH"
          bash tools/test-devcontainer.sh
      - run: task verify
      - run: task docs
        if: ${{ !cancelled() && hashFiles('artifacts/tests.xml') != '' }}
      - name: Verify preview provenance against runner context
        if: ${{ !cancelled() && hashFiles('artifacts/manual/html/provenance.json') != '' }}
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -e --arg revision "$EXPECTED_REVISION" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '.revision == $revision and .ci_run == $run and .dirty == false' \
            artifacts/manual/html/provenance.json
      - run: task test:docs
        if: ${{ !cancelled() && hashFiles('artifacts/manual/html/index.html') != '' }}
      - run: task package
      - run: task smoke
      - name: Publish individual tests in job summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: MuJoCo tests (amd64)
          path: artifacts/*.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mujoco-evidence-amd64
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: mujoco-products-amd64
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: documentation-preview
          path: artifacts/manual/
          retention-days: 14
          if-no-files-found: error
      - name: Upload verified Pages site
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: artifacts/manual/html
  publish-tests:
    needs: verify
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      - name: Publish test check
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: MuJoCo tests (amd64)
          artifact: mujoco-evidence-amd64
          path: '*.xml'
          reporter: python-xunit
          use-actions-summary: 'false'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
  deploy-docs:
    needs: [verify, publish-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    concurrency:
      group: mujoco-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check current main inside deployment lock
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale revision $EXPECTED_SHA; main is $current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
        if: steps.fresh.outputs.deploy == 'true'
  release:
    needs: [verify, publish-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v4.3.0
    with:
      draft-release: true
  assemble:
    needs: release
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task verify
      - run: task package
      - run: task smoke
      - name: Save versioned OCI-compatible Docker image archive
        run: docker save "livingproof-sim-mujoco:$VERSION" | gzip -n > dist/runtime-amd64.tar.gz
      - name: Checksum complete assets
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.deb > SHA256SUMS
      - name: Attach tested assets to draft only
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*.deb dist/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
