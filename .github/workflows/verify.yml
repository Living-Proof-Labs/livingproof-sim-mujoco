name: MuJoCo verification
on:
  pull_request:
  push:
    branches: [main, ci/reporting-failure]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      REPORTING_FAILURE_FIXTURE: ${{ github.ref == 'refs/heads/ci/reporting-failure' && '1' || '0' }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - name: Verify Dev Containers lifecycle and installed CLI
        run: |
          npm install --prefix "$RUNNER_TEMP/devcontainer-cli" @devcontainers/cli@0.89.0
          export PATH="$RUNNER_TEMP/devcontainer-cli/node_modules/.bin:$PATH"
          bash tools/test-devcontainer.sh
      - run: task verify
      - run: task docs
        if: ${{ !cancelled() && hashFiles('artifacts/tests.xml') != '' }}
      - name: Verify preview provenance against runner context
        if: ${{ !cancelled() && hashFiles('artifacts/manual/html/provenance.json') != '' }}
        env:
          EXPECTED_REVISION: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          jq -e --arg revision "$EXPECTED_REVISION" \
            --arg run "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            '.revision == $revision and .ci_run == $run and .dirty == false' \
            artifacts/manual/html/provenance.json
      - run: task test:docs
        if: ${{ !cancelled() && hashFiles('artifacts/manual/html/index.html') != '' }}
      - run: task package
      - run: task smoke
      - name: Publish individual tests in job summary
        if: ${{ !cancelled() }}
        uses: dorny/test-reporter@d1b5dff021aa968b288b02285a8bf47471c5928a
        with:
          name: MuJoCo tests (amd64)
          path: artifacts/*.xml
          reporter: python-xunit
          use-actions-summary: 'true'
          collapsed: never
          fail-on-error: 'true'
          fail-on-empty: 'true'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          # The attempt is part of the name. publish-tests downloads every
          # artifact with that name, and a failed-job rerun keeps earlier attempts.
          name: mujoco-evidence-amd64-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: ${{ always() && hashFiles('dist/**') != '' }}
        with:
          name: mujoco-products-amd64
          path: dist/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: documentation-preview
          path: artifacts/manual/
          retention-days: 14
          if-no-files-found: error
  test-arm64:
    name: verify (arm64)
    # #38: the zero-command stand must also run on arm64. Same development image,
    # same EGL command as Taskfile.runtime.yml's test task, no -k exclusion.
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - name: Zero-command stand and evidence tests on arm64 (EGL)
        run: docker compose run --rm tooling sh -c 'MUJOCO_GL=egl uv run --no-sync pytest tests/test_evidence.py --junitxml=artifacts/evidence.xml'
      - name: Scenario limit, command speed and refusal tests on arm64 (real runner required)
        run: docker compose run --rm tooling sh -c 'MUJOCO_GL=egl REQUIRE_SCENARIO=1 uv run --no-sync pytest -v tests/test_manifest_limits.py tests/test_manifest_command_speed.py tests/test_command_speed_refusal.py --junitxml=artifacts/limits.xml'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: mujoco-evidence-arm64-${{ github.run_attempt }}
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
  publish-tests:
    needs: [verify, test-arm64]
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: mujoco-evidence-amd64-${{ github.run_attempt }}
          path: reports
      # dorny's check mode creates the run in progress and then updates it.
      # That update returns 404 Not Found and leaves MuJoCo tests (amd64) stuck.
      # This step creates the run already completed. A check API failure is a
      # warning; a failed, empty, or missing report still fails the job.
      - name: Publish completed test check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/test_results.py --name "MuJoCo tests (amd64)" --path '*.xml' --root reports
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: ${{ !cancelled() }}
        with:
          name: mujoco-evidence-arm64-${{ github.run_attempt }}
          path: reports-arm64
      - name: Publish completed arm64 test check
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/test_results.py --name "MuJoCo tests (arm64)" --path 'evidence.xml' --root reports-arm64
      - name: Publish completed arm64 limit test check
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 tools/test_results.py --name "MuJoCo limit tests (arm64)" --path 'limits.xml' --root reports-arm64
  deploy-docs:
    needs: [release, assemble]
    if: needs.release.outputs.draft-created == 'true' && needs.assemble.result == 'success'
    runs-on: ubuntu-24.04
    concurrency:
      group: mujoco-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
      VERSION: ${{ needs.release.outputs.version }}
      DOCS_VERSION: ${{ needs.release.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.release.outputs.git-tag }}
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false
      - name: Require the published immutable release for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > artifacts/release.json
          python3 tools/released_manual.py
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - name: Match checkout ownership
        run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - name: Reuse exact-release CLI evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-evidence
          path: artifacts/
      - run: task docs
      - run: task test:docs
      - name: Verify the rendered release identity before upload
        run: python3 tools/released_manual.py --site
      - name: Package the verified Pages HTML
        id: pages-package
        shell: bash
        run: |
          set -euo pipefail
          cd artifacts/manual/html
          test -f index.html
          test -z "$(find . ! -type f ! -type d -print -quit)"
          tar --dereference --hard-dereference -cf "$RUNNER_TEMP/artifact.tar" .
          digest=$(sha256sum "$RUNNER_TEMP/artifact.tar")
          echo "tar-sha256=${digest%% *}" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        id: pages-artifact
        with:
          name: github-pages-${{ needs.release.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
      # Use the same-run Actions artifact client (like deploy-pages), not the REST index.
      # An exact ID and name must both resolve to the sealed Pages tar before deploying.
      - name: Require a valid Pages artifact ID
        shell: bash
        env:
          UPLOADED_ID: ${{ steps.pages-artifact.outputs.artifact-id }}
        run: |
          [[ "$UPLOADED_ID" =~ ^[1-9][0-9]*$ ]]
      - name: Read exact Pages artifact by ID
        id: pages-id-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/mujoco-pages-id-first
      - name: Allow the ID lookup to settle
        if: steps.pages-id-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by ID once
        id: pages-id-retry
        if: steps.pages-id-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          artifact-ids: ${{ steps.pages-artifact.outputs.artifact-id }}
          path: ${{ runner.temp }}/mujoco-pages-id-retry
      - name: Read exact Pages artifact by name
        id: pages-name-first
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ needs.release.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mujoco-pages-name-first
      - name: Allow the name lookup to settle
        if: steps.pages-name-first.outcome == 'failure'
        run: sleep 4
      - name: Retry read by name once
        id: pages-name-retry
        if: steps.pages-name-first.outcome == 'failure'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: github-pages-${{ needs.release.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mujoco-pages-name-retry
      - name: Require matching ID and name readback of the exact tar
        shell: bash
        env:
          EXPECTED_TAR: ${{ steps.pages-package.outputs.tar-sha256 }}
          EXPECTED_NAME: github-pages-${{ needs.release.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
          ID_READBACK: ${{ steps.pages-id-first.outcome == 'success' && steps.pages-id-first.outputs.download-path || steps.pages-id-retry.outputs.download-path }}
          NAME_READBACK: ${{ steps.pages-name-first.outcome == 'success' && steps.pages-name-first.outputs.download-path || steps.pages-name-retry.outputs.download-path }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_TAR" =~ ^[0-9a-f]{64}$ ]]
          test -n "$ID_READBACK"
          test -n "$NAME_READBACK"
          for path in "$ID_READBACK/$EXPECTED_NAME" "$NAME_READBACK"; do
            test -f "$path/artifact.tar"
            digest=$(sha256sum "$path/artifact.tar")
            test "${digest%% *}" = "$EXPECTED_TAR"
          done
      - name: Check current main inside deployment lock
        id: fresh
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [ "$current" = "$EXPECTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "Skipping stale revision $EXPECTED_SHA; main is $current" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
        id: deployment
        if: steps.fresh.outputs.deploy == 'true'
        with:
          artifact_name: github-pages-${{ needs.release.outputs.version }}-${{ github.sha }}-${{ github.run_attempt }}
  release-boundary:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      release-needed: ${{ steps.classify.outputs.release-needed }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Classify unreleased robot test-pin changes
        id: classify
        run: python3 tools/release_boundary.py
  release:
    needs: [verify, publish-tests, release-boundary]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.release-boundary.outputs.release-needed == 'true'
    permissions:
      contents: write
    uses: Living-Proof-Labs/collaboration-guidelines/.github/workflows/semantic-release.yml@v9.10.2
    with:
      draft-release: true
  assemble:
    needs: release
    if: needs.release.outputs.draft-created == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.release.outputs.version }}
      RELEASE_TAG: ${{ needs.release.outputs.git-tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          ref: ${{ needs.release.outputs.git-tag }}
          persist-credentials: false
      - uses: go-task/setup-task@a00fbb05ce67b35648be3c78cbc9fd85354c757e
        with:
          version: '3.54.0'
      - run: |
          echo "LOCAL_UID=$(id -u)" >> "$GITHUB_ENV"
          echo "LOCAL_GID=$(id -g)" >> "$GITHUB_ENV"
      - run: task setup
      - run: task verify
      - run: task package
      - run: task smoke
      - name: Save versioned OCI-compatible Docker image archive
        run: docker save "livingproof-sim-mujoco:$VERSION" | gzip -n > dist/runtime-amd64.tar.gz
      - name: Checksum complete assets
        run: |
          cd dist
          sha256sum *.whl *.tar.gz *.deb > SHA256SUMS
      - name: Attach tested assets to the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$RELEASE_TAG" dist/*.whl dist/*.tar.gz dist/*.deb dist/SHA256SUMS --clobber
      # Same mechanism as capability-verifier and livingproof-capability-report: semantic-release
      # creates a draft so assets attach before anyone can download it, then this publishes it.
      - name: Publish the release once every tested asset is attached
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$RELEASE_TAG" --draft=false --repo "$GITHUB_REPOSITORY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: release-evidence
          path: artifacts/
          retention-days: 14
          if-no-files-found: error
