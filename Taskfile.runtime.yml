version: '3'
env:
  UV_PYTHON_DOWNLOADS: never
tasks:
  setup:
    desc: Install locked project dependencies
    cmds: [uv sync --locked]
  check:
    desc: Check formatting, lint and generated CLI reference
    cmds:
      - uv run --no-sync ruff check .
      - uv run --no-sync ruff format --check .
      - uv run --no-sync python tools/docs.py --check
      - uv run --no-sync python tools/task_reference.py --check
  test:
    desc: Exercise real MuJoCo physics and shutdown with JUnit results
    cmds: [uv run --no-sync pytest tests/test_cli.py --junitxml=artifacts/tests.xml]
  docs:reference:
    desc: Generate CLI reference from executable help
    cmds:
      - uv run --no-sync python tools/docs.py
      - uv run --no-sync python tools/task_reference.py
  verify:
    desc: Check code and run physics tests
    cmds:
      - task: check
      - task: test
  package:
    desc: Build locked wheelhouse, wheel, source archive and amd64 Debian package
    cmds: [uv run --no-sync python tools/package.py]
  docs:
    desc: Build Markdown manual with installed-wheel help and scenario results
    cmds: [uv run --no-sync python tools/manual.py]
  test:docs:
    desc: Verify manual links, assets and browser behavior
    cmds: [uv run --no-sync pytest tests/docs --junitxml=artifacts/docs.xml]
  docs:browser:
    desc: Install pinned Chromium in the prepared tooling container
    cmds: [uv run --no-sync playwright install chromium]
