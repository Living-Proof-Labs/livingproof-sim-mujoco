# Adapted from collaboration-guidelines v4.3.0 templates/python/Taskfile.yml.
version: '3'
env:
  UV_PYTHON_DOWNLOADS: never
tasks:
  default:
    desc: Show prepared-environment commands
    cmds: [task -t Taskfile.runtime.yml --list]
  setup:
    desc: Install locked project dependencies
    cmds: [uv sync --locked]
  check:
    desc: Check formatting, lint and generated CLI reference
    cmds:
      - uv run --no-sync ruff check .
      - uv run --no-sync ruff format --check .
      - uv run --no-sync python tools/docs.py --check
      - uv run --no-sync python tools/task_reference.py --check
  test:
    desc: Exercise real MuJoCo physics and shutdown with JUnit results
    cmds:
      - uv run --no-sync pytest tests/test_cli.py --junitxml=artifacts/tests.xml
      - uv run --no-sync pytest tests/test_tasks.py --junitxml=artifacts/tasks.xml
      - uv run --no-sync pytest tests/test_policy.py --junitxml=artifacts/policy.xml
      - uv run --no-sync pytest tests/test_hallway.py --junitxml=artifacts/hallway.xml
      - uv run --no-sync pytest tests/test_observations.py --junitxml=artifacts/observations.xml
      - uv run --no-sync pytest tests/test_contract.py --junitxml=artifacts/contract.xml
      - uv run --no-sync pytest tests/test_installed_adapter_commit.py --junitxml=artifacts/installed-adapter.xml
      - uv run --no-sync pytest tests/test_pins.py --junitxml=artifacts/pins.xml
      # The zero-command stand writes a MuJoCo video and needs a display.
      - uv run --no-sync pytest tests/test_evidence.py -k "not zero_command_check" --junitxml=artifacts/evidence.xml
      - uv run --no-sync pytest tests/test_fit_width.py --junitxml=artifacts/fit-width.xml
      - uv run --no-sync pytest tests/test_scenario_sources.py --junitxml=artifacts/scenario-sources.xml
      - uv run --no-sync pytest tests/test_compose.py --junitxml=artifacts/compose.xml
      - uv run --no-sync pytest tests/test_world_parity.py --junitxml=artifacts/parity.xml
      # Changed by the --lock work but not run in CI before (review of PR #42).
      # OSMesa: the dev image has no display. MuJoCo reads MUJOCO_GL before import.
      - MUJOCO_GL=osmesa uv run --no-sync pytest tests/test_media.py --junitxml=artifacts/media.xml
      - uv run --no-sync pytest tests/test_walk_scene_measure.py tests/test_cpu_dispatch.py tests/test_release_workflow.py tests/test_test_results.py --junitxml=artifacts/other.xml
      - uv run --no-sync pytest tests/test_lock_cli_review.py --junitxml=artifacts/lock-cli.xml
  docs:reference:
    desc: Generate CLI reference from executable help
    cmds:
      - uv run --no-sync python tools/docs.py
      - uv run --no-sync python tools/task_reference.py
  verify:
    desc: Check code and run physics tests
    cmds:
      - task: check
      - task: test
  package:
    desc: Build locked wheelhouse, wheel, source archive and amd64 Debian package
    cmds: [uv run --no-sync python tools/package.py]
  docs:
    desc: Build Markdown manual with installed-wheel help and scenario results
    cmds: [uv run --no-sync python tools/manual.py]
  test:docs:
    desc: Verify manual links, assets and browser behavior
    cmds: [uv run --no-sync pytest tests/docs --junitxml=artifacts/docs.xml]
  docs:browser:
    desc: Install pinned Chromium in the prepared tooling container
    cmds: [uv run --no-sync playwright install chromium]
  preview:
    desc: Render built-in physics playback and serve only its output on port 8000
    cmds:
      - uv run --no-sync python tools/preview.py
  render:
    desc: Render falling-sphere evidence and exit without a server
    cmds: [uv run --no-sync python tools/preview.py --render-only]
  test:preview:
    desc: Check real rendering, HTTP isolation and browser playback controls
    cmds: [uv run --no-sync pytest tests/test_preview.py --junitxml=artifacts/preview.xml]
  hallway:
    desc: Check the pinned hallway-open fixture in MuJoCo and write the evidence bundle
    cmds: [uv run --no-sync python tools/hallway.py]
